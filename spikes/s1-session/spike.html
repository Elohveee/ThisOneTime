<!doctype html>
<!--
  spike.html: the single screen for Spike S1.

  Purpose:      Let the user start the test and copy its privacy-safe report.
  Interactions: spike.js wires up the Run and Copy buttons.
  Styling:      System colors only, so it follows light and dark mode.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>ThisOneTime S1 Spike</title>
    <style>
      body {
        background: Canvas;
        color: CanvasText;
        font: 14px/1.5 system-ui, sans-serif;
        margin: 0 auto;
        max-width: 720px;
        padding: 24px 16px;
      }
      main { display: flex; flex-direction: column; gap: 16px; }
      h1, p { margin: 0; }
      h1 { font-size: 20px; }
      .actions { display: flex; gap: 8px; }
      button { border-radius: 8px; font: inherit; padding: 6px 14px; }
      pre {
        border: 1px solid GrayText;
        border-radius: 8px;
        margin: 0;
        max-height: 60vh;
        overflow: auto;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ThisOneTime S1 Spike</h1>
      <p>
        This read-only test checks that the extension can use your Bandcamp
        session. It reads a small part of your collection and the first bytes of
        one file. It does not save or change anything.
      </p>
      <p>The report contains no names, titles, IDs, tokens, or download links.</p>
      <div class="actions">
        <button id="run" type="button">Run test</button>
        <button id="copy" type="button" disabled>Copy report</button>
      </div>
      <p id="status" role="status" aria-live="polite">Ready.</p>
      <pre id="report" tabindex="0" aria-label="Test report" hidden></pre>
    </main>
    <script type="module" src="spike.js"></script>
  </body>
</html>
